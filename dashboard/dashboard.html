<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Tracker Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0ece3;
      color: #2c2c2c;
      padding: 48px 60px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid #d6cfc3;
    }

    .header-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 600;
      color: #3a5a40;
      letter-spacing: -0.5px;
    }

    .header-left p {
      font-size: 13px;
      color: #8a8070;
      margin-top: 4px;
      font-weight: 300;
    }

    .export-btn {
      background: #3a5a40;
      color: #f0ece3;
      border: none;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .export-btn:hover { background: #2d4730; }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #fff;
      padding: 24px 28px;
      border-radius: 16px;
      flex: 1;
      border: 1px solid #e8e2d9;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: #7a9e7e;
      border-radius: 4px 0 0 4px;
    }

    .stat-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      color: #3a5a40;
      font-weight: 600;
    }

    .stat-card p {
      font-size: 12px;
      color: #8a8070;
      margin-top: 4px;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid #d6cfc3;
      background: #fff;
      color: #8a8070;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { border-color: #3a5a40; color: #3a5a40; }

    .tab-btn.active {
      background: #3a5a40;
      color: #f0ece3;
      border-color: #3a5a40;
    }

    .tab-count {
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
    }

    .tab-btn:not(.active) .tab-count {
      background: #f0ece3;
      color: #8a8070;
    }

    /* ── Portal badge in table ── */
    .portal-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      display: inline-block;
    }

    .portal-linkedin { background: #dce8f5; color: #0a66c2; }
    .portal-indeed   { background: #fff3d6; color: #a3720a; }
    .portal-naukri   { background: #fde8f0; color: #c2185b; }
    .portal-unknown  { background: #f0ece3; color: #8a8070; }

    .table-wrapper {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e8e2d9;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead { background-color: #3a5a40; }

    th {
      padding: 16px 20px;
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      color: #d6e8d8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      padding: 16px 20px;
      font-size: 13px;
      border-bottom: 1px solid #f0ece3;
      color: #3a3530;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8f5f0; }

    .delete-btn {
      background: none;
      border: 1px solid #e8d8d8;
      color: #c17070;
      cursor: pointer;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .delete-btn:hover { background: #fde8e8; border-color: #c17070; }

    select.status-select {
      background: transparent;
      border: none;
      color: #3a3530;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .empty {
      text-align: center;
      padding: 80px;
      color: #8a8070;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>Job Tracker</h1>
      <p>All your applications in one place</p>
    </div>
    <button class="export-btn" id="exportBtn">Export CSV</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h2 id="totalCount">0</h2>
      <p>Total Applied</p>
    </div>
    <div class="stat-card">
      <h2 id="interviewCount">0</h2>
      <p>Interviews</p>
    </div>
    <div class="stat-card">
      <h2 id="offerCount">0</h2>
      <p>Offers</p>
    </div>
    <div class="stat-card">
      <h2 id="rejectedCount">0</h2>
      <p>Rejected</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="all">All <span class="tab-count" id="count-all">0</span></button>
    <button class="tab-btn" data-tab="linkedin">🔵 LinkedIn <span class="tab-count" id="count-linkedin">0</span></button>
    <button class="tab-btn" data-tab="indeed">🟡 Indeed <span class="tab-count" id="count-indeed">0</span></button>
    <button class="tab-btn" data-tab="naukri">🟠 Naukri <span class="tab-count" id="count-naukri">0</span></button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Job Title</th>
          <th>Company</th>
          <th>Portal</th>
          <th>Status</th>
          <th>Date Applied</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="jobTableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">
      No applications yet. Start tracking your journey.
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
