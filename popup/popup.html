<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      background-color: #f0ece3;
      color: #2c2c2c;
    }

    .header {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #d6cfc3;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: #3a5a40;
      font-weight: 600;
    }

    .subtitle {
      font-size: 11px;
      color: #8a8070;
      margin-top: 2px;
      font-weight: 300;
    }

    label {
      font-size: 11px;
      color: #8a8070;
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #e0d9ce;
      background-color: #fff;
      color: #2c2c2c;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #7a9e7e;
    }

    input::placeholder {
      color: #b0a898;
      font-weight: 300;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 30px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      transition: all 0.2s;
    }

    #saveBtn {
      background-color: #3a5a40;
      color: #f0ece3;
    }

    #saveBtn:hover {
      background-color: #2d4730;
    }

    #dashboardBtn {
      background-color: #fff;
      color: #3a5a40;
      border: 1px solid #c8d9c9;
    }

    #dashboardBtn:hover {
      background-color: #dceadd;
    }

    #message {
      margin-top: 10px;
      font-size: 11px;
      color: #3a5a40;
      text-align: center;
      min-height: 16px;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Job Tracker</h1>
    <p class="subtitle">Track your applications</p>
  </div>

  <label>Job Title</label>
  <input type="text" id="jobTitle" placeholder="e.g. Frontend Developer" />

  <label>Company</label>
  <input type="text" id="company" placeholder="e.g. Google" />

  <label>Status</label>
  <select id="status">
    <option value="Applied">Applied</option>
    <option value="Interview">Interview</option>
    <option value="Offer">Offer</option>
    <option value="Rejected">Rejected</option>
  </select>

  <div class="buttons">
    <button id="saveBtn">Save Job</button>
    <button id="dashboardBtn">Dashboard</button>
  </div>

  <p id="message"></p>

  <script src="popup.js"></script>
</body>
</html>
